style:
  # Already enforced by ktlint's own `standard:max-line-length` rule, using the `max_line_length = 140` value set in
  # this project's .editorconfig. detekt's default threshold (120) does not know about that override and would
  # otherwise flag ~2280 lines that ktlintCheck already accepts.
  MaxLineLength:
    active: false
  # See the note on the `complexity` section below - ReturnCount lives under `style` in detekt 2.x.
  ReturnCount:
    active: false
  # Disallowing comments with keywords like "TODO" and "FIXME" is counterproductive for situations in which something cannot be done or
  # fixed at the moment. Activating this rule could lead to writing same comment without the keyword.
  ForbiddenComment:
    active: false

complexity:
  # This codebase deliberately keeps a rule's logic inside its own `RuleV2` subclass (plus shared helpers in
  # ASTNodeExtension.kt) instead of splitting it across additional classes/files - see the "Rule Definition" and
  # "AST Traversal" sections of CLAUDE.md. That choice naturally produces large classes with many, and sometimes
  # long or branchy, member functions across the rule engine, the standard ruleset and the CLI/reporters. These
  # size/complexity metrics were checked against this project's actual architecture, not disabled reflexively:
  # the findings span dozens of files across multiple modules (not just ktlint-ruleset-standard), all tracing back
  # to this one, intentional design decision.
  LargeClass:
    active: false
  TooManyFunctions:
    active: false
  LongMethod:
    active: false
    excludes:
      # Allow long methods in test classes as extracting logic from tests to functions might reduce readability
      - '**/*Test.kt'
  NestedBlockDepth:
    active: false
  ComplexCondition:
    active: false
  CyclomaticComplexMethod:
    active: false

naming:
  # Already enforced by ktlint rule `standard:enum-entry-name-case`
  EnumNaming:
    active: false
